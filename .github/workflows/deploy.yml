name: Deploy nga-discipline-attendance to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SSO_CLIENT_SECRET: ${{ secrets.SSO_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SSO_CLIENT_SECRET,JWT_SECRET
          script: |
            set -e
            cd /opt/apps/nga-discipline-attendance

            git fetch origin main
            git reset --hard origin/main

            # DATABASE_PATH deliberately points OUTSIDE this git working
            # tree. attendance.db used to live at server/data/ *and* be
            # tracked in git, so the `git reset --hard` above overwrote the
            # live production database with the repo's dev copy on every
            # deploy -- wiping real records and logging everyone out (their
            # session's user row vanished, so every request 403'd). The file
            # is now gitignored and stored where git can't reach it.
            cat > server/.env <<EOF
            PORT=5171
            NODE_ENV=production
            NGA_MIS_BASE_URL=https://api.amashuri.com
            SSO_CLIENT_ID=discipline_attendance
            SSO_CLIENT_SECRET="${SSO_CLIENT_SECRET}"
            JWT_SECRET="${JWT_SECRET}"
            DATABASE_PATH=/opt/apps/tendo-data/attendance.db
            CORS_ORIGINS=https://tendo.amashuri.com
            ADMIN_EMAILS=emmanuelniyongabo44@gmail.com
            EOF

            cat > client/.env <<EOF
            VITE_MIS_LOGIN_URL=https://mis.amashuri.com/login
            VITE_MIS_HOME_URL=https://mis.amashuri.com
            VITE_TASKMENTOR_HOME_URL=https://taskmentor.amashuri.com
            VITE_SSO_CLIENT_ID=discipline_attendance
            VITE_API_BASE_URL=/api
            EOF

            # 644, not 600: the SSH deploy user and the user pm2 runs the
            # process as aren't the same account (see nga-task-mentor's
            # deploy.yml for the same fix).
            chmod 644 server/.env client/.env

            cd server
            npm ci
            npm run build
            npm prune --omit=dev
            cd ..

            cd client
            npm ci
            npm run build
            cd ..

            pm2 restart discipline-attendance --update-env || pm2 start server/dist/index.js --name discipline-attendance --update-env
            pm2 save
            sudo /usr/sbin/nginx -t && sudo systemctl reload nginx
