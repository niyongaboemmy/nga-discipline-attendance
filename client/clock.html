<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Theme before first paint: the person's choice, else the phone's setting.
      (function () {
        try {
          var t = localStorage.getItem('tendo.clock.theme') || 'auto';
          if (t === 'auto') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" id="ck-manifest" href="/clock.webmanifest" />
    <script>
      // The Home Screen icon must open THIS school: point the install manifest at the school in the address.
      (function () {
        try {
          var m = location.pathname.match(/^\/c\/([A-Za-z0-9-]{1,63})\/?$/);
          if (m) document.getElementById('ck-manifest').setAttribute('href', '/api/clock/' + m[1].toLowerCase() + '/manifest');
        } catch (e) { /* keep the shared manifest */ }
      })();
      // Never a blank page. If the page's script cannot load (an old copy asking for a file a new
      // release removed) or nothing appears in a few seconds: drop the saved copies and load again,
      // once; after that, say so with a button.
      (function () {
        var KEY = 'tendo.clock.recovered';
        function fresh() {
          var done = function () { location.replace(location.pathname + location.search); };
          try {
            sessionStorage.setItem(KEY, String(Date.now()));
            var jobs = [];
            if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            Promise.all(jobs).then(done, done);
            setTimeout(done, 3000);
          } catch (e) { done(); }
        }
        function recover() {
          var root = document.getElementById('clock-root');
          if (root && root.childElementCount && !root.querySelector('[data-ck-boot]')) return;
          var tried = 0;
          try { tried = Number(sessionStorage.getItem(KEY) || 0); } catch (e) { /* private mode */ }
          if (!tried || Date.now() - tried > 120000) return fresh();
          if (!root) return;
          root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;font-family:system-ui,sans-serif">'
            + '<b style="font-size:22px">The check-in page could not open</b>'
            + '<span style="font-size:16px;opacity:.75;max-width:320px">Check your internet connection, then try again.</span>'
            + '<button id="ck-retry" style="height:56px;padding:0 28px;border-radius:999px;border:0;background:#2563eb;color:#fff;font-size:17px;font-weight:600">Try again</button></div>';
          document.getElementById('ck-retry').onclick = fresh;
        }
        window.addEventListener('error', function (e) { var t = e && e.target; if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) recover(); }, true);
        window.addEventListener('load', function () { setTimeout(recover, 7000); });
      })();
    </script>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Attendance" />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Staff attendance</title>
    <style>
      /* The first thing on screen, before any script: a quiet loading mark in the page's own colours. */
      html, body { margin: 0; background: #ffffff; }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #030712; }
      .ck-boot { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #111827; }
      html[data-theme='dark'] .ck-boot { color: #f9fafb; }
      .ck-boot b { font-size: 18px; font-weight: 600; margin-top: 8px; }
      .ck-boot span:last-child { font-size: 15px; opacity: .65; }
      .ck-boot-ring { width: 54px; height: 54px; border-radius: 999px; border: 4px solid rgba(37, 99, 235, .22); border-top-color: #2563eb; animation: ck-boot-spin .9s linear infinite; }
      @keyframes ck-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .ck-boot-ring { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <!-- Shown at once, before the page's script has loaded (a Home Screen app opens to this, never to an
         empty screen); the app replaces it when it starts. -->
    <div id="clock-root"><div data-ck-boot class="ck-boot" role="status" aria-live="polite"><span class="ck-boot-ring" aria-hidden="true"></span><b>Staff attendance</b><span>Opening…</span></div></div>
    <script type="module" src="/src/clock/main.tsx"></script>
  </body>
</html>
