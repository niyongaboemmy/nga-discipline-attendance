<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1e6fd9" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Typography: Inter (UI) + JetBrains Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400;1,14..32,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Tendo</title>
    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-page, #000);
        z-index: 9999;
      }
      .app-boot-badge {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-boot-badge img {
        position: relative;
        z-index: 1;
        width: 40px;
        height: 40px;
      }
      .app-boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 18px;
        border: 2px solid var(--primary, #2563eb);
        animation: app-boot-ring 1.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        pointer-events: none;
      }
      .app-boot-ring-delayed {
        animation-delay: 0.9s;
      }
      @keyframes app-boot-ring {
        0% {
          transform: scale(0.85);
          opacity: 0.55;
        }
        100% {
          transform: scale(1.95);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-ring {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot" role="status" aria-label="Loading Tendo">
        <div class="app-boot-badge">
          <span class="app-boot-ring"></span>
          <span class="app-boot-ring app-boot-ring-delayed"></span>
          <img src="/favicon.svg" alt="" width="40" height="40" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
