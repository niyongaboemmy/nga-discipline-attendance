# nga-discipline-attendance — nginx server blocks
# Copy to /etc/nginx/sites-available/tendo.conf then:
#   sudo ln -s /etc/nginx/sites-available/tendo.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run certbot afterwards to fill in the SSL directives automatically:
#   sudo certbot --nginx -d tendo.amashuri.com -d tendo-api.amashuri.com

# Frontend (static build)
server {
    listen 80;
    server_name tendo.amashuri.com;

    root /opt/apps/nga-discipline-attendance/client/dist;
    index index.html;

    client_max_body_size 25m;
    # This app's session JWT nests the MIS's own JWT inside it (misToken),
    # which itself embeds academic years/terms/grades/systems -- easily
    # over nginx's default 8k client header buffer, which silently 400s
    # the request before it reaches the app (seen on the apps-switcher
    # flow). Same class of fix as proxy_buffer_size below, but for
    # incoming request headers instead of upstream response headers.
    large_client_header_buffers 8 32k;

    # The client calls same-origin relative paths like fetch('/api/...')
    # rather than an absolute VITE_API_BASE_URL (unlike taskmentor/mis), so
    # this proxy is required for the app to work, in addition to the
    # dedicated tendo-api.amashuri.com server block below.
    location /api/ {
        proxy_pass http://127.0.0.1:5171;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# Backend API
server {
    listen 80;
    server_name tendo-api.amashuri.com;

    client_max_body_size 25m;
    # This app's session JWT nests the MIS's own JWT inside it (misToken),
    # which itself embeds academic years/terms/grades/systems -- easily
    # over nginx's default 8k client header buffer, which silently 400s
    # the request before it reaches the app (seen on the apps-switcher
    # flow). Same class of fix as proxy_buffer_size below, but for
    # incoming request headers instead of upstream response headers.
    large_client_header_buffers 8 32k;

    location / {
        proxy_pass http://127.0.0.1:5171;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same header-size fix applied to the other apps on this box --
        # see nginx-mis.conf / nginx-taskmentor.conf.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }
}
